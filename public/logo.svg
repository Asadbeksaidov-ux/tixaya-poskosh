<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- Decorative lines -->
  <line x1="10" y1="40" x2="50" y2="40" stroke="#D28744" stroke-width="0.8" opacity="0.7"/>
  <line x1="230" y1="40" x2="270" y2="40" stroke="#D28744" stroke-width="0.8" opacity="0.7"/>
  
  <!-- Small diamond left -->
  <polygon points="55,40 62,34 69,40 62,46" fill="#D28744" opacity="0.6"/>
  
  <!-- Small diamond right -->
  <polygon points="211,40 218,34 225,40 218,46" fill="#D28744" opacity="0.6"/>
  
  <!-- Main text: ТИХАЯ -->
  <text x="140" y="30" 
    font-family="Cormorant Garamond, Georgia, serif" 
    font-size="13" 
    font-weight="300"
    letter-spacing="6"
    text-anchor="middle" 
    fill="#3D1F0A"
    opacity="0.85">ТИХАЯ</text>
  
  <!-- Main text: Роскошь -->
  <text x="140" y="58" 
    font-family="Cormorant Garamond, Georgia, serif" 
    font-size="28" 
    font-weight="600"
    font-style="italic"
    letter-spacing="2"
    text-anchor="middle" 
    fill="#3D1F0A">Роскошь</text>
    
  <!-- Underline accent -->
  <line x1="80" y1="65" x2="200" y2="65" stroke="#D28744" stroke-width="0.6" opacity="0.5"/>
</svg>
